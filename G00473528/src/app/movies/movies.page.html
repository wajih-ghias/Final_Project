<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Movies</ion-title>
    <ion-button (click)="openHomePage()">Back to HOME PAGE<ion-icon name="home-outline"></ion-icon></ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngFor="let movie of movieInfo">
    <img *ngIf="movie.poster_path" [src]="posterBaseUrl + movie.poster_path" [alt]="movie.title" />
    <ion-card-header>
      <ion-card-title>{{movie.original_title}}</ion-card-title>
      <ion-card-subtitle>Release Date: {{movie.release_date}} Movie Language: {{movie.original_language}}</ion-card-subtitle>
    </ion-card-header>
  
    <ion-card-content>
      {{ movie.overview }}
    </ion-card-content>
  </ion-card>
</ion-content>
