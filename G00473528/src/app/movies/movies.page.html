<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Movies</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card *ngFor="let movie of movieInfo">
    <img *ngIf="movie.poster_path" [src]="posterBaseUrl + movie.poster_path" [alt]="movie.title" />
    <ion-card-header>
      <ion-card-title>{{movie.original_title}}</ion-card-title>
      <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
    </ion-card-header>
  
    <ion-card-content>
      {{ movie.overview }}
    </ion-card-content>
  </ion-card>
</ion-content>
