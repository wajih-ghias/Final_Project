
<ion-header>
  <ion-toolbar>
    
    <ion-buttons slot="start">
      <ion-button (click)="openHomePage()">
        <ion-icon slot="icon-only" name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title></ion-title>

   
    <ion-buttons slot="end">
      
      <ion-button *ngIf="!isMovieFavorite()" (click)="addMovieToFavorites()" color="primary" fill="solid">
        Add To Favourites
        <ion-icon slot="start" name="heart-outline"></ion-icon>
      </ion-button>
      
      <ion-button *ngIf="isMovieFavorite()" (click)="removeMovieFromFavorites()" color="danger">
        Remove From Favourites
        <ion-icon slot="start" name="heart-outline"></ion-icon>
      </ion-button>

      
      <ion-button routerLink="/favourites">
        <ion-icon slot="icon-only" name="heart-outline" color="danger" fill="solid"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>



<ion-content class="ion-padding" *ngIf="movie">
 
  <h2>{{ movie.title }}</h2>
  <p>{{ movie.overview }}</p>

  <h3>Top Cast</h3>
  <ion-list>
    <ion-item *ngFor="let actor of cast" [routerLink]="['/details', actor.id]">
      
      <ion-label>
        <h2>{{ actor.name }}</h2>
        <p>as {{ actor.character }}</p>
        <img *ngIf="actor.profile_path" [src]="posterBaseUrl + actor.profile_path" />
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
