<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home"><ion-icon name="home-outline"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>Details</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/favorites"><ion-icon name="heart"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="movie">
  <h1>{{ movie.title }}</h1>
  <p>{{ movie.overview }}</p>

  <h3>Top Cast</h3>
  <ion-list>
    <ion-item *ngFor="let actor of cast">
      <ion-label>
        <h2>{{ actor.name }}</h2>
        <p>as {{ actor.character }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <!-- Add to Favourites Button -->
  <ion-button *ngIf="!isFavorite" expand="block" color="primary" (click)="addToFavorites()">
    <ion-icon slot="start" name="heart-outline"></ion-icon>
    Add To Favourites
  </ion-button>
  
  <!-- If ALREADY a favorite, show Remove button -->
  <ion-button *ngIf="isFavorite" expand="block" color="danger" (click)="removeFromFavorites()">
    <ion-icon slot="start" name="trash-outline"></ion-icon>
    Remove From Favourites
  </ion-button>
</ion-content>
